<span
    class="
        calendar-event
        calendar-event--{{ event.style_key }}
    "
>

    <span class="calendar-event__marker"></span>

    <span class="calendar-event__content">

        <strong>
            {{ event.title }}
        </strong>

        <small>
            {{ event.type_label }}
        </small>

    </span>

</span>
